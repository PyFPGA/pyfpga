name: 'lint'

on:
  push:
    paths: &shared_paths
      - 'examples/**'
      - 'pyfpga/**'
      - 'tests/**'
  pull_request:
    paths: *shared_paths

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install jinja2 pycodestyle pylint
    - name: Run linting
      run: make lint
